<!doctype html>
<!-- Mẫu ảnh xem trước khi chia sẻ link (1200×630). Tạo lại: tools/make-og.bat -->
<html lang="vi"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: "Be Vietnam Pro", Arial, sans-serif; color: #E7F3F1; position: relative;
    background: radial-gradient(circle at 78% 30%, rgba(20,195,181,.35), transparent 45%), linear-gradient(135deg, #07141A, #0B1D24 60%, #0F242C); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(47,217,200,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(47,217,200,.06) 1px, transparent 1px); background-size: 40px 40px; }
  .txt { position: absolute; left: 80px; top: 92px; width: 680px; }
  .k { font-family: "JetBrains Mono", monospace; color: #2FD9C8; font-size: 22px; letter-spacing: 3px; }
  h1 { font-size: 84px; line-height: 1; margin: 22px 0 18px; font-weight: 900; letter-spacing: -2px; background: linear-gradient(120deg, #E7F3F1 35%, #2FD9C8 70%, #3BB3D4); -webkit-background-clip: text; color: transparent; }
  p { font-size: 30px; margin: 0; color: #B5CCC9; font-weight: 500; }
  .kpi { position: absolute; left: 80px; bottom: 70px; display: flex; gap: 18px; }
  .kpi div { padding: 16px 22px; border-radius: 16px; background: rgba(15,36,44,.85); border: 1px solid #2A4B54; }
  .kpi b { display: block; font-family: "JetBrains Mono", monospace; font-size: 36px; color: #E7F3F1; }
  .kpi b em { color: #2FD9C8; font-style: normal; }
  .kpi small { font-size: 17px; color: #7F9C99; }
  .ava { position: absolute; right: 90px; top: 110px; width: 300px; height: 300px; border-radius: 50%; padding: 8px; background: conic-gradient(from 140deg, #14C3B5, #3BB3D4, #5EE0CF, #14C3B5); }
  .ava img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 8px solid #0B1D24; box-sizing: border-box; }
</style></head>
<body><div class="grid"></div>
<div class="txt"><div class="k">PORTFOLIO · FP&amp;A · DATA · AI</div><h1>Trần Quang Vinh</h1><p>Trưởng phòng Kế hoạch · Head of Planning<br>Bán lẻ · Power BI · SQL · Agentic AI</p></div>
<div class="ava"><img src="../web/assets/avatar.jpg" alt=""></div>
<div class="kpi"><div><b>9 <em>năm</em></b><small>hoạch định</small></div><div><b>50</b><small>cửa hàng</small></div><div><b>20<em>+</em></b><small>dự án thẩm định</small></div><div><b>70<em>%</em></b><small>tự phục vụ nhờ AI</small></div><div><b>10<em>+</em></b><small>web app AI</small></div></div>
</body></html>
