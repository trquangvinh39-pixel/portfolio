<!doctype html>
<!-- Ảnh bìa LinkedIn (?v=linkedin, 1584×396) và Zalo (?v=zalo, 1280×800), nền sáng, tiếng Anh.
     Xuất ảnh: banners/make-banners.bat -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root { --ink: #0D2B2A; --ink-2: #3A5A57; --muted: #5F7C78; --teal: #0E9C95; --teal-d: #0B7F79; --teal-3: #14C3B5; --amber: #D99A2B; --line: rgba(14,156,149,.28); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow: hidden; }
  body { font-family: "Be Vietnam Pro", Arial, sans-serif; color: var(--ink); position: relative;
    background: radial-gradient(ellipse 60% 90% at 90% 0%, rgba(20,195,181,.26), transparent 60%), radial-gradient(ellipse 50% 80% at 0% 100%, rgba(15,163,160,.16), transparent 60%), radial-gradient(ellipse 40% 60% at 100% 100%, rgba(227,162,59,.10), transparent 60%), linear-gradient(120deg, #E4F4F1 0%, #F6FAF9 40%, #FFFFFF 62%, #EAF7F4 100%); }
  svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(14,156,149,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(14,156,149,.06) 1px, transparent 1px); background-size: 44px 44px; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, var(--teal), var(--teal-3) 60%, var(--amber)); }
  .kicker { font-family: "JetBrains Mono", monospace; font-weight: 700; color: var(--teal); letter-spacing: 3px; text-transform: uppercase; }
  .kicker span { color: var(--amber); }
  h1 { font-weight: 900; letter-spacing: -1px; line-height: 1.06; color: var(--ink); }
  h1 em { font-style: normal; background: linear-gradient(100deg, var(--teal-d), var(--teal) 45%, var(--amber)); -webkit-background-clip: text; color: transparent; }
  .sub { color: var(--ink-2); font-weight: 500; }
  .sub b { color: var(--teal-d); font-weight: 700; }
  .kpis { display: flex; }
  .kpi { border-left: 2.5px solid var(--teal-3); }
  .kpi b { display: block; font-family: "JetBrains Mono", monospace; font-weight: 700; color: var(--ink); line-height: 1; }
  .kpi b i { font-style: normal; color: var(--teal); }
  .kpi small { display: block; color: var(--muted); line-height: 1.25; font-weight: 500; }
  .kpi.ai { border-left-color: var(--amber); }
  .kpi.ai b i { color: var(--amber); }
  .link { display: flex; align-items: center; background: rgba(255,255,255,.85); border: 1.5px solid var(--line); border-radius: 18px; box-shadow: 0 10px 30px rgba(13,60,56,.10); }
  .qr { background: #fff; border-radius: 10px; flex: none; border: 1px solid rgba(14,156,149,.18); }
  .qr img { display: block; width: 100%; height: 100%; }
  .link .t small { display: block; color: var(--teal); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
  .link .t b { display: block; color: var(--ink); font-weight: 700; }
  .link .t b span { color: var(--teal); }
  .link .t em { display: block; font-style: normal; color: var(--ink-2); font-weight: 500; }

  /* ===== LinkedIn 1584×396 — ảnh đại diện che góc dưới trái, nội dung dồn sang phải ===== */
  body.linkedin { width: 1584px; height: 396px; }
  .linkedin .wrap { position: absolute; left: 450px; right: 64px; top: 0; bottom: 6px; display: flex; align-items: center; gap: 40px; }
  .linkedin .main { flex: 1; min-width: 0; }
  .linkedin .kicker { font-size: 15px; }
  .linkedin h1 { font-size: 31px; margin: 10px 0 10px; white-space: nowrap; }
  .linkedin .sub { font-size: 18px; white-space: nowrap; }
  .linkedin .kpis { gap: 26px; margin-top: 22px; }
  .linkedin .kpi { padding-left: 13px; }
  .linkedin .kpi b { font-size: 27px; }
  .linkedin .kpi small { font-size: 13px; margin-top: 5px; }
  .linkedin .link { flex-direction: column; gap: 12px; padding: 16px 16px 14px; text-align: center; width: 232px; }
  .linkedin .qr { width: 132px; height: 132px; padding: 9px; }
  .linkedin .link .t small { font-size: 10.5px; letter-spacing: 1px; white-space: nowrap; }
  .linkedin .link .t b { font-size: 13.5px; margin-top: 3px; }
  .linkedin .link .t em { font-size: 12px; margin-top: 4px; }

  /* ===== Zalo 1280×800 — ảnh đại diện che giữa phía dưới, nội dung ở nửa trên ===== */
  body.zalo { width: 1280px; height: 800px; }
  .zalo .wrap { position: absolute; left: 0; right: 0; top: 74px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .zalo .kicker { font-size: 17px; }
  .zalo h1 { font-size: 58px; margin: 18px 0 14px; max-width: 1000px; }
  .zalo .sub { font-size: 23px; }
  .zalo .kpis { gap: 34px; margin-top: 30px; }
  .zalo .kpi { padding-left: 15px; text-align: left; }
  .zalo .kpi b { font-size: 34px; }
  .zalo .kpi small { font-size: 15px; margin-top: 6px; }
  .zalo .main { display: flex; flex-direction: column; align-items: center; }
  .zalo .link { gap: 18px; padding: 12px 22px 12px 12px; margin-top: 34px; }
  .zalo .qr { width: 92px; height: 92px; padding: 7px; }
  .zalo .link .t { text-align: left; }
  .zalo .link .t small { font-size: 13px; }
  .zalo .link .t b { font-size: 22px; margin-top: 4px; }
  .zalo .link .t em { font-size: 16px; margin-top: 4px; }
</style></head>
<body>
<svg class="bg" id="bg"></svg>
<div class="grid"></div>
<div class="wrap" id="wrap"></div>
<div class="bar"></div>
<script>
  var v = /v=zalo/.test(location.search) ? 'zalo' : 'linkedin';
  document.body.className = v;
  var W = v === 'zalo' ? 1280 : 1584, H = v === 'zalo' ? 800 : 396;
  var URL_TXT = 'tranquangvinh-portfolio<span>.netlify.app</span>';

  var T = {
    linkedin: {
      kicker: 'Retail FP&amp;A <span>•</span> Data &amp; BI <span>•</span> Agentic AI',
      h1: 'Data-driven planning for <em>sustainable retail growth</em>',
      sub: '<b>Head of Planning</b> · Forecasting · Store P&amp;L · Network expansion · Power BI, SQL',
      kpis: [['9', ' yrs', 'in planning'], ['~50', '', 'stores in scope'], ['20', '+', 'projects appraised'], ['~70', '%', 'self-service via AI', 1], ['10', '+ apps', 'AI-powered web apps', 1]],
      link: ['Work portfolio &amp; contact', 'tranquangvinh-portfolio<br><span>.netlify.app</span>', 'trquangvinh39@gmail.com'],
    },
    zalo: {
      kicker: 'Retail FP&amp;A <span>•</span> Data &amp; BI <span>•</span> Agentic AI',
      h1: 'Data-driven planning for<br><em>sustainable retail growth</em>',
      sub: '<b>Head of Planning</b> · Forecasting · Store P&amp;L · Network expansion · Power BI, SQL',
      kpis: [['9', ' yrs', 'in planning'], ['~50', '', 'stores in scope'], ['20', '+', 'projects appraised'], ['~70', '%', 'self-service via AI', 1], ['10', '+ apps', 'AI-powered web apps', 1]],
      link: ['Work portfolio &amp; contact', URL_TXT, 'trquangvinh39@gmail.com'],
    },
  }[v];

  document.getElementById('wrap').innerHTML =
    '<div class="main"><p class="kicker">' + T.kicker + '</p><h1>' + T.h1 + '</h1><p class="sub">' + T.sub + '</p>' +
    '<div class="kpis">' + T.kpis.map(function (k) { return '<div class="kpi' + (k[3] ? ' ai' : '') + '"><b>' + k[0] + '<i>' + k[1] + '</i></b><small>' + k[2] + '</small></div>'; }).join('') + '</div>' +
    (v === 'zalo' ? linkHtml() : '') + '</div>' + (v === 'linkedin' ? linkHtml() : '');
  function linkHtml() { return '<div class="link"><div class="qr"><img src="../cv/qr-portfolio.svg" alt=""></div><div class="t"><small>' + T.link[0] + '</small><b>' + T.link[1] + '</b><em>' + T.link[2] + '</em></div></div>'; }

  // Nền: mạng lưới 50 điểm (= 50 cửa hàng) + đường thực hiện / dự báo / kế hoạch, cố định theo hạt giống
  var seed = 11;
  function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
  var s = '', pts = [];
  // Vùng đặt điểm: LinkedIn rải bên trái (dưới ảnh đại diện mờ), Zalo rải quanh viền
  for (var i = 0; i < 50; i++) {
    var x, y;
    if (v === 'linkedin') { x = rnd() * 520; y = rnd() * H; if (rnd() < .35) { x = 420 + rnd() * (W - 420); y = rnd() < .5 ? rnd() * 50 : H - rnd() * 60; } }
    else { var side = rnd(); if (side < .35) { x = rnd() * 230; y = rnd() * H; } else if (side < .7) { x = W - rnd() * 230; y = rnd() * H; } else { x = rnd() * W; y = H - rnd() * 210; } }
    pts.push([x, y, 1.6 + rnd() * 2.4]);
  }
  for (var a = 0; a < pts.length; a++) for (var b = a + 1; b < pts.length; b++) {
    var d = Math.hypot(pts[a][0] - pts[b][0], pts[a][1] - pts[b][1]);
    if (d < 140) s += '<line x1="' + pts[a][0] + '" y1="' + pts[a][1] + '" x2="' + pts[b][0] + '" y2="' + pts[b][1] + '" stroke="rgba(14,156,149,' + ((1 - d / 140) * .28).toFixed(3) + ')" stroke-width="1"/>';
  }
  pts.forEach(function (p) { s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + p[2] + '" fill="rgba(14,156,149,' + (.25 + p[2] / 12).toFixed(2) + ')"/>'; });

  // Biểu đồ thực hiện - dự báo - kế hoạch
  var cx0, cx1, cy0, cy1;
  if (v === 'linkedin') { cx0 = 40; cx1 = 430; cy0 = 330; cy1 = 70; } else { cx0 = 60; cx1 = W - 60; cy0 = 770; cy1 = 560; }
  var act = [0, .12, .08, .25, .33, .3, .45, .55, .62], n = 12;
  function X(i) { return cx0 + (cx1 - cx0) * i / (n - 1); }
  function Y(f) { return cy0 - (cy0 - cy1) * f; }
  var ap = act.map(function (f, i) { return X(i) + ',' + Y(f); }).join(' ');
  var fc = [[8, .62], [9, .72], [10, .84], [11, 1]].map(function (q) { return X(q[0]) + ',' + Y(q[1]); }).join(' ');
  s += '<line x1="' + X(0) + '" y1="' + Y(.02) + '" x2="' + X(11) + '" y2="' + Y(.78) + '" stroke="rgba(217,154,43,.7)" stroke-width="2" stroke-dasharray="7 7"/>';
  s += '<polygon points="' + X(0) + ',' + cy0 + ' ' + ap + ' ' + X(8) + ',' + cy0 + '" fill="rgba(20,195,181,.12)"/>';
  s += '<polyline points="' + ap + '" fill="none" stroke="rgba(14,156,149,.85)" stroke-width="3" stroke-linejoin="round"/>';
  s += '<polyline points="' + fc + '" fill="none" stroke="rgba(14,156,149,.85)" stroke-width="3" stroke-dasharray="9 7"/>';
  act.forEach(function (f, i) { s += '<circle cx="' + X(i) + '" cy="' + Y(f) + '" r="4.5" fill="#fff" stroke="rgba(14,156,149,.95)" stroke-width="2"/>'; });
  s += '<circle cx="' + X(11) + '" cy="' + Y(1) + '" r="14" fill="rgba(227,162,59,.22)"/><circle cx="' + X(11) + '" cy="' + Y(1) + '" r="6.5" fill="#E3A23B"/>';
  var bg = document.getElementById('bg');
  bg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  bg.innerHTML = s;
</script>
</body></html>
